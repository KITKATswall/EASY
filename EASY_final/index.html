<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4d400"><title>EASY — Развозки</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">EASY</div><span id="who"></span><button id="logout" class="ghost hidden">Выйти</button></header>
<main id="auth"><section class="auth">
<div class="hero"><h1>Заказы без лишней суеты</h1><p>Продавец отправляет заявку за полминуты. Владелец сразу видит, сколько чего собрать на каждый день.</p>
<div class="ticket" aria-hidden="true"><b>Заявка №128</b><span>Бургеры 24, круассаны 12, хот-доги 18</span><em>Принята</em></div></div>
<div class="card"><div class="tabs"><button data-tab="login">Войти</button><button data-tab="register">Регистрация</button><button data-tab="owner">Владелец</button></div>
<form id="loginForm"><input id="email" type="email" placeholder="Email" autocomplete="username" required><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button class="primary">Войти</button></form>
<form id="registerForm" class="hidden"><input id="rEmail" type="email" placeholder="Email" autocomplete="username" required><input id="rPass" type="password" placeholder="Придумайте пароль" autocomplete="new-password" required><div id="rules" class="rules"></div><button class="primary">Создать аккаунт</button></form>
<form id="ownerForm" class="hidden"><input id="oLogin" placeholder="Логин" autocomplete="username" required><input id="oPass" type="password" placeholder="Пароль" autocomplete="current-password" required><button class="primary">Войти как владелец</button></form>
</div></section></main>
<div id="shell" class="hidden"><nav id="nav"></nav><main id="page"></main></div>
<div id="modal" class="hidden"><div class="modal" role="dialog" aria-modal="true"><button class="x" data-close aria-label="Закрыть">×</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
